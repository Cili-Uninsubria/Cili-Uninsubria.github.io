<body>

<!-- HEADER INCLUDE -->
<div id="header"></div>

<!-- NAVBAR INCLUDE -->
<div id="navbar"></div>


<main>
<!-- MAIN CONTENT -->

  <div class="container">
    <div class="section">
      <div class="elenco">
        <h1> Software </h1>
          <div id="softwares"></div>
      </div>
    </div>
  </div>

</main>


<script>
function createSoftware(title, link, paper) {
  return `

    <ul>
      <li class="mb-2"> <h4>${title}</h4>
        <a href="${link}" target="_blank">${link}</a><br>
        ${paper}
      </li>
    </ul>
  `;
}

// Lista membri
const softwares = [
  {
    title: "Iterated Arnoldi Tikhonov method",
    link: "https://github.com/davide-furchi/iterated-Arnoldi-Tikhonov",
    paper: "D. Bianchi, M. Donatelli, D. Furchì, and L. Reichel. Convergence analysis and parameter estimation for the iterated Arnoldi-Tikhonov method. Numer. Math. 157, 749-779 (2025). https://doi.org/10.1007/s00211-025-01472-9"
  },

  // aggiungi altri qui
];

// Render
document.getElementById("softwares").innerHTML =
  softwares.map(m => createSoftware(m.title, m.link, m.paper)).join("");
</script>



<!-- FOOTER INCLUDE -->
<div id="footer"></div>


<!-- JS INCLUDE SYSTEM -->
<script>
  function loadHTML(id, file) {
    fetch(file)
      .then(response => response.text())
      .then(data => document.getElementById(id).innerHTML = data);
  }

  loadHTML("header", "header.html");
  loadHTML("navbar", "navbar.html");
  loadHTML("footer", "footer.html");
</script>

<!-- Bootstrap JS-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
