<body>

<!-- HEADER INCLUDE -->
<div id="header"></div>

<!-- NAVBAR INCLUDE -->
<div id="navbar"></div>

<main> 
<!-- MAIN CONTENT -->
  
  <div class="container">
    <div class="section">
      <div class="elenco">
        <h1> Projects </h1>
          <div id="projects_list"></div>
      </div>
    </div>
  </div>

</main>



<script>

function createProjectsListItem(title, funder, PI, link, local_members) {
  return `
    <li class="mb-2">
       <a href="${link}" >${title}</a> <br>
      funded by ${funder} <br>
      Principal Investigator: ${PI} <br>
      participants: ${local_members}
    </li>
  `;
}

// Lista progetti
const projects_list = [
  {
    title: "Intrecci Digitali - Scansioni che tessono inclusione e innovazione (ID-TEX)",
    funder: "Regione Lombardia",
    PI: "Marco Donatelli",
    link: "https://uninsubria.unifind.cineca.it/individual?uri=http%3A%2F%2Firises.uninsubria.it%2Fresource%2Fproject%2FPRJ-0795",
    local_members: "Stefano Aleotti, Claudia Binda, Davide Furchì, Pietro Maurino, Federica Pes, Marco Ratto, Giuseppe Scarlato, Chiara Zanotta"
  },
  {
    title: "Inverse Problems in the Imaging Sciences (IPIS)",
    funder: "MUR - PRIN 2022",
    PI: "Marco Donatelli",
    link: "https://uninsubria.unifind.cineca.it/individual?uri=http%3A%2F%2Firises.uninsubria.it%2Fresource%2Fproject%2FPRJ-0468",
    local_members: "Stefano Aleotti, Davide Furchì, Marco Ratto, Giuseppe Scarlato, Pietro Maurino, Claudia Binda, Nikos Barakitis"
  },

  // aggiungi altri qui
];

// Render
document.getElementById("projects_list").innerHTML =
  `<ul class="member-list">` +
  projects_list.map(m => createProjectsListItem(m.title, m.funder, m.PI, m.link, m.local_members)).join("") +
  `</ul>`;
</script>


<!-- FOOTER INCLUDE -->
<div id="footer"></div>


<!-- JS INCLUDE SYSTEM -->
<script>
  function loadHTML(id, file) {
    fetch(file)
      .then(response => response.text())
      .then(data => document.getElementById(id).innerHTML = data);
  }

  loadHTML("header", "header.html");
  loadHTML("navbar", "navbar.html");
  loadHTML("footer", "footer.html");
</script>

<!-- Bootstrap JS-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
